<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Niche Finder Pro</title>
</head>
<body>

  <h1>Niche Finder Pro</h1>

  <h2>Prihlásenie / Registrácia</h2>

  <input type="email" id="email" placeholder="Email">
  <br><br>

  <input type="password" id="password" placeholder="Heslo">
  <br><br>

  <button onclick="login()">Prihlásiť</button>

  <button onclick="register()">Registrovať</button>

  <br><br>

  <p id="result"></p>

  <script>
    const API_URL =
      "https://niche-finder-pro-production.up.railway.app";

    async function register() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      try {

        const response = await fetch(
          API_URL + "/api/auth/register",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email,
              password
            })
          }
        );

        const data = await response.json();

        if (response.ok) {

          document.getElementById("result").innerHTML =
            "✅ Registrácia úspešná";

        } else {

          document.getElementById("result").innerHTML =
            "❌ " + (data.message || "Registrácia zlyhala");

        }

      } catch (error) {

        document.getElementById("result").innerHTML =
          "❌ Server nie je dostupný";

      }
    }

    async function login() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      try {

        const response = await fetch(
          API_URL + "/api/auth/login",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email,
              password
            })
          }
        );

        const data = await response.json();

        if (data.token) {

          localStorage.setItem(
            "token",
            data.token
          );

          document.getElementById("result").innerHTML =
            "✅ Prihlásenie úspešné";

        } else {

          document.getElementById("result").innerHTML =
            "❌ Chyba prihlásenia";

        }

      } catch (error) {

        document.getElementById("result").innerHTML =
          "❌ Server nie je dostupný";

      }

    }
  </script>

</body>
</html>
